<!-- 07-report-export.html : "Copy summary" (markdown to clipboard) + "Print / save as PDF" one-page report.   Effort M, risk low.
     INSTALL: paste before </body>.  Adds two buttons to the header (visible only on the dashboard) and a @media print sheet that
     hides the interactive bits (Ask box, preview tabs, forecast controls, buttons), un-clips the sidebar, and prints
     title+date, KPIs, findings, next steps, charts and forecast on two A4 pages (page 1 narrative + KPIs, page 2 charts).
     Charts: Plotly SVGs drawn at screen size overlap when the print layout changes, so the Print button first snapshots every chart with
     Plotly.toImage() into a print-only <img>, calls window.print(), and removes the images on afterprint.  (Ctrl+P bypasses this - use the button.)  Reads only DOM text (#sum .ins #recs #kpis #meta), so it
     survives a restyle as long as those ids stay.  Pairs with the weekly-PDF idea on the README roadmap. -->
<style>
  header .rep { display: none; margin-left: 0 }
  header .rep + .rep { margin-left: 0 }
  #again { margin-left: auto }
  @media (max-width: 700px) { header .rep { display: none !important } }   /* phones: no room in the header, and printing from a phone is rare */
  #printhead { display: none }
  .print-chart { display: none }
  @media print {
    @page { size: A4; margin: 12mm }
    html { scroll-padding-top: 0 }
    body { background: #fff !important; font-size: 12px }
    header, #hero, #trust, .askbar, .chips, #qerr, #ans, section:has(#q), .tabs, #preview-box, #preview-note, section:has(#preview-box), .fcbar, #ferr, #uerr, #samples { display: none !important }
    #printhead { display: block; margin: 0 0 8px; padding-bottom: 6px; border-bottom: 2px solid #0E6B6B }
    #printhead h1 { font-size: 20px; max-width: none } #printhead p { margin: 2px 0 0; color: #586674; font-size: 11px; max-width: none }
    main { padding: 0; max-width: none }
    #app { display: block !important }
    aside { position: static !important; max-height: none !important; overflow: visible !important; padding: 0 }
    .summary { background: #fff !important; color: #14202B !important; border: 1px solid #14202B; padding: 8px 12px }
    .summary h3, .summary p { color: #14202B !important }
    aside h3 { margin: 10px 0 4px }
    #ins { columns: 2; column-gap: 18px } .ins { break-inside: avoid; margin-bottom: 8px }
    .kpis { margin: 10px 0 } section { border: 0; padding: 0; margin: 0 0 10px; break-inside: avoid }
    .js-plotly-plot { display: none !important } .print-chart { display: block; width: 100%; height: auto; margin: 2px 0 8px }
    section h2, section .sub, figcaption, .charts .note { break-after: avoid } .print-chart { break-inside: avoid }
    .charts { display: block } .charts .note, .charts figcaption { margin: 4px 0 !important } section:has(#charts), section:has(#fchart) { break-inside: auto }
    .charts .wide, .charts .chart { height: auto !important }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact }
  }
</style>
<script>
(function () {
  const header = document.querySelector('header'), app = document.querySelector('#app'), again = document.querySelector('#again');
  if (!header || !app || document.getElementById('rep-copy')) return;
  const mk = (id, label, fn) => { const b = document.createElement('button'); b.id = id; b.className = 'btn rep'; b.type = 'button'; b.textContent = label; b.onclick = fn; again.before(b); return b };
  const text = s => (document.querySelector(s) || {}).innerText || '';
  const markdown = () => {
    const ins = [...document.querySelectorAll('#ins .ins')].map(i => `- **${i.querySelector('b').innerText}**: ${(i.querySelector('p') || {}).innerText || ''}`).join('\n');
    const recs = [...document.querySelectorAll('#recs li')].map((l, i) => `${i + 1}. ${l.innerText}`).join('\n');
    const kpis = [...document.querySelectorAll('#kpis .kpi')].map(k => `- ${k.querySelector('small').innerText}: **${k.querySelector('strong').innerText}** ${(k.querySelector('em') || {}).innerText || ''}`.trim()).join('\n');
    return `# Lumen report: ${new Date().toLocaleDateString(undefined, { dateStyle: 'long' })}\n_${text('#meta')}_\n\n## What matters most\n${text('#sum')}\n\n## Key numbers\n${kpis}\n\n## Findings\n${ins || '_No strong patterns found._'}\n\n## What to do next\n${recs || '_None._'}\n\n_Generated by Lumen. Forecast: ${text('#fnote')}_\n`;
  };
  const copy = mk('rep-copy', 'Copy summary', async () => {
    const md = markdown(); try { await navigator.clipboard.writeText(md) } catch (e) { const ta = document.createElement('textarea'); ta.value = md; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove() }
    copy.textContent = 'Copied'; setTimeout(() => copy.textContent = 'Copy summary', 1600);
  });
  const snap = async () => {
    if (!window.Plotly) return;
    for (const g of document.querySelectorAll('.js-plotly-plot')) {
      if (!g.offsetParent || g.id === 'rc') continue;
      try { const wide = g.id === 'fchart' || g.closest('.wide') || g.classList.contains('wide');
        const url = await Plotly.toImage(g, { format: 'png', width: 720, height: g.id === 'fchart' ? 190 : wide ? 170 : 140, scale: 2 });
        const im = new Image(); im.className = 'print-chart'; im.src = url; im.alt = g.getAttribute('aria-label') || 'Chart'; g.before(im) } catch (e) { }
    }
  };
  mk('rep-print', 'Print / save PDF', async () => { document.querySelectorAll('.print-chart').forEach(i => i.remove()); await snap(); window.print() });
  addEventListener('afterprint', () => document.querySelectorAll('.print-chart').forEach(i => i.remove()));
  const ph = document.createElement('div'); ph.id = 'printhead'; document.querySelector('main').prepend(ph);
  const refresh = () => { const on = getComputedStyle(app).display !== 'none'; document.querySelectorAll('header .rep').forEach(b => b.style.display = on ? 'inline-block' : 'none') };
  new MutationObserver(refresh).observe(app, { attributes: true, attributeFilter: ['style'] }); refresh();
  addEventListener('beforeprint', () => {
    ph.innerHTML = `<h1>Lumen report</h1><p>${new Date().toLocaleDateString(undefined, { dateStyle: 'long' })} · ${text('#meta')}</p>`;
  });
  window.lumenReportMarkdown = markdown;   // handy for tests / a future "email me this" button
})();
</script>
